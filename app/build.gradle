plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stonx.camera.bridge'
    compileSdk 34

    defaultConfig {
        applicationId 'com.stonx.camera.bridge'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0-stage1'
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('keystores/stonx-debug.keystore')
            storePassword 'stonxdebug'
            keyAlias 'stonxdebug'
            keyPassword 'stonxdebug'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Stage 1 intentionally has no runtime dependencies.
}
