name: Build STONX Camera Bridge APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7 without wrapper jar
        run: |
          set -euo pipefail
          GRADLE_VERSION=8.7
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Ensure Android SDK components used by this project
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +e +o pipefail
          yes | "$SDK_MANAGER" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -e -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            exit "$LICENSE_STATUS"
          fi
          "$SDK_MANAGER" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Verify tool versions
        run: |
          set -euo pipefail
          java -version
          gradle --version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed >/tmp/sdkmanager-installed.txt
          sed -n '1,80p' /tmp/sdkmanager-installed.txt

      - name: Restore and verify debug keystore from base64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p keystores
          base64 --decode keystores/stonx-debug.keystore.b64 > keystores/stonx-debug.keystore
          KEYTOOL_OUT=/tmp/stonx-debug-keytool-list.txt
          keytool -list -v \
            -keystore keystores/stonx-debug.keystore \
            -storepass stonxdebug \
            -alias stonxdebug > "$KEYTOOL_OUT"
          grep -q "Alias name: stonxdebug" "$KEYTOOL_OUT"
          grep -q "Entry type:" "$KEYTOOL_OUT"
          echo "Debug keystore restored from base64 and verified with keytool."

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature, badging, manifest tree, and size
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/34.0.0"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          echo "APK_PATH=$APK_PATH"
          wc -c < "$APK_PATH" | awk '{print "APK_SIZE_BYTES=" $1}'
          ls -lh "$APK_PATH"

          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          "$AAPT2" dump badging "$APK_PATH"
          "$AAPT2" dump xmltree "$APK_PATH" --file AndroidManifest.xml

      - name: Verify manifest policy for STONX
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          export APK_PATH
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          apk = os.environ['APK_PATH']
          build_tools = os.path.join(os.environ['ANDROID_HOME'], 'build-tools', '34.0.0')
          aapt2 = os.path.join(build_tools, 'aapt2')

          badging = subprocess.check_output([aapt2, 'dump', 'badging', apk], text=True)
          xml = subprocess.check_output([aapt2, 'dump', 'xmltree', apk, '--file', 'AndroidManifest.xml'], text=True)

          def fail(msg):
              print('MANIFEST_POLICY_FAIL:', msg)
              sys.exit(1)

          def leading_spaces(line):
              return len(line) - len(line.lstrip(' '))

          def element_blocks(text, marker):
              lines = text.splitlines()
              out = []
              i = 0
              while i < len(lines):
                  if lines[i].lstrip().startswith(marker + ' '):
                      indent = leading_spaces(lines[i])
                      j = i + 1
                      while j < len(lines):
                          if lines[j].lstrip().startswith('E: ') and leading_spaces(lines[j]) <= indent:
                              break
                          j += 1
                      out.append('\n'.join(lines[i:j]))
                      i = j
                  else:
                      i += 1
              return out

          def attr_bool(block, attr, expected):
              m = re.search(
                  re.escape(attr) +
                  r'(?:\([^)]*\))?\s*=\s*(?:"(true|false)"|(true|false)|(?:\(type\s+0x[0-9A-Fa-f]+\)\s*)?(0x[0-9A-Fa-f]+))',
                  block
              )
              if not m:
                  return False
              word = m.group(1) or m.group(2)
              if word is not None:
                  return word == expected
              value = int(m.group(3), 16)
              return value == (0xFFFFFFFF if expected == 'true' else 0)

          activity_blocks = element_blocks(xml, 'E: activity')
          service_blocks = element_blocks(xml, 'E: service')

          print('--- AAPT2 ACTIVITY BLOCKS ---')
          for idx, block in enumerate(activity_blocks, 1):
              print('--- activity %d ---' % idx)
              print(block)
          if not activity_blocks:
              print('<missing>')

          print('--- AAPT2 SERVICE BLOCKS ---')
          for idx, block in enumerate(service_blocks, 1):
              print('--- service %d ---' % idx)
              print(block)
          if not service_blocks:
              print('<missing>')

          if len(activity_blocks) != 1:
              fail('expected exactly one activity block, found %d' % len(activity_blocks))
          if len(service_blocks) != 1:
              fail('expected exactly one service block, found %d' % len(service_blocks))

          activity_block = activity_blocks[0]
          service_block = service_blocks[0]

          if 'CaptureActivity' not in activity_block:
              fail('CaptureActivity name missing')
          if not attr_bool(activity_block, 'android:exported', 'true'):
              fail('CaptureActivity exported=true not found in supported aapt2 boolean form')

          filters = element_blocks(xml, 'E: intent-filter')
          print('--- AAPT2 INTENT-FILTER BLOCKS ---')
          for idx, block in enumerate(filters, 1):
              print('--- intent-filter %d ---' % idx)
              print(block)
          if not filters:
              print('<none>')
          for block in filters:
              has_main = re.search(r'android:name(?:\([^)]*\))?\s*=\s*"android\.intent\.action\.MAIN"', block) is not None
              has_launcher = re.search(r'android:name(?:\([^)]*\))?\s*=\s*"android\.intent\.category\.LAUNCHER"', block) is not None
              if has_main and has_launcher:
                  fail('launcher MAIN/LAUNCHER intent-filter is present')

          if 'RecordingForegroundService' not in service_block:
              fail('RecordingForegroundService name missing')
          if not attr_bool(service_block, 'android:exported', 'false'):
              fail('service exported=false not found in supported aapt2 boolean form')

          mask = None
          m = re.search(
              re.escape('android:foregroundServiceType') +
              r'(?:\([^)]*\))?\s*=\s*(?:\(type\s+0x[0-9A-Fa-f]+\)\s*)?(0x[0-9A-Fa-f]+)',
              service_block
          )
          if m:
              mask = int(m.group(1), 16)
          if mask is None:
              fail('service foregroundServiceType numeric mask not found')
          print('FOREGROUND_SERVICE_TYPE_MASK=0x%08x' % mask)
          if (mask & 0x40) == 0:
              fail('foregroundServiceType missing camera bit 0x40')
          if (mask & 0x80) == 0:
              fail('foregroundServiceType missing microphone bit 0x80')
          if mask != 0xC0:
              fail('foregroundServiceType has extra or missing types: expected exactly 0x000000c0')

          required_permissions = [
              'android.permission.CAMERA',
              'android.permission.RECORD_AUDIO',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_CAMERA',
              'android.permission.FOREGROUND_SERVICE_MICROPHONE',
              'android.permission.WAKE_LOCK',
              'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS',
          ]
          for permission in required_permissions:
              if "uses-permission: name='%s'" % permission not in badging:
                  fail('missing permission: ' + permission)

          forbidden_permissions = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.FOREGROUND_SERVICE_DATA_SYNC',
              'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK',
              'android.permission.READ_PHONE_STATE',
              'android.permission.WRITE_EXTERNAL_STORAGE',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.MANAGE_EXTERNAL_STORAGE',
          ]
          for permission in forbidden_permissions:
              if "uses-permission: name='%s'" % permission in badging:
                  fail('forbidden permission present: ' + permission)

          print('MANIFEST_POLICY_OK')
          PY

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stonx-camera-bridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

